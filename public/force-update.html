<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update wird durchgeführt...</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      font-size: 1.1rem;
      margin: 1rem 0;
      font-weight: 500;
    }
    .log {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", "Droid Sans Mono", "Source Code Pro", "Courier New", monospace;
      font-size: 0.85rem;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .log p {
      margin: 0.5rem 0;
      line-height: 1.6;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 App wird aktualisiert</h1>
    <div class="spinner"></div>
    <p class="status">Cache wird aktualisiert, bitte warten...</p>
    <div class="log" id="log"></div>
  </div>

  <script>
    const log = document.getElementById('log');

    function addLog(message, type = 'success') {
      console.log(message);
      const p = document.createElement('p');
      p.className = type;
      const icon = type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : '✓';
      p.textContent = `${icon} ${message}`;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    async function forceUpdate() {
      try {
        addLog('Update-Prozess gestartet', 'info');

        // 1. Unregister all service workers
        addLog('Service Worker werden deregistriert...', 'info');
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length === 0) {
            addLog('Keine Service Worker gefunden');
          } else {
            for (const reg of registrations) {
              await reg.unregister();
              addLog(`Service Worker deregistriert: ${reg.scope}`);
            }
          }
        } else {
          addLog('Service Worker nicht unterstützt', 'info');
        }

        // Small delay to ensure unregistration completes
        await new Promise(resolve => setTimeout(resolve, 500));

        // 2. Delete all caches
        addLog('Alle Caches werden gelöscht...', 'info');
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          if (cacheNames.length === 0) {
            addLog('Keine Caches gefunden');
          } else {
            for (const cacheName of cacheNames) {
              await caches.delete(cacheName);
              addLog(`Cache gelöscht: ${cacheName}`);
            }
          }
        } else {
          addLog('Cache API nicht unterstützt', 'info');
        }

        // 3. Migrate localStorage
        addLog('localStorage wird migriert...', 'info');

        const oldDesktop = localStorage.getItem('viewSettings-desktop');
        const oldMobile = localStorage.getItem('viewSettings-mobile');
        const currentSettings = localStorage.getItem('viewSettings');

        if (oldDesktop && !currentSettings) {
          localStorage.setItem('viewSettings', oldDesktop);
          addLog('Desktop-Settings → viewSettings migriert');
        } else if (oldMobile && !currentSettings) {
          localStorage.setItem('viewSettings', oldMobile);
          addLog('Mobile-Settings → viewSettings migriert');
        } else if (currentSettings) {
          addLog('viewSettings bereits vorhanden', 'info');
        } else {
          addLog('Keine Settings zum Migrieren gefunden', 'info');
        }

        // Remove old keys
        let removedCount = 0;
        if (oldDesktop) {
          localStorage.removeItem('viewSettings-desktop');
          removedCount++;
        }
        if (oldMobile) {
          localStorage.removeItem('viewSettings-mobile');
          removedCount++;
        }
        if (removedCount > 0) {
          addLog(`${removedCount} alte Setting-Keys gelöscht`);
        }

        // Version handling:
        // We deliberately do NOT hard-code a version here. We remove the stored
        // app-version so that main.tsx sets the CURRENT version (from
        // src/lib/version.ts) on the next load. This keeps this recovery tool
        // from ever going stale again.
        localStorage.removeItem('app-version');
        addLog('app-version zurückgesetzt (App setzt aktuelle Version beim Neuladen)');

        // 4. Clear sessionStorage
        addLog('sessionStorage wird geleert...', 'info');
        const sessionCount = sessionStorage.length;
        sessionStorage.clear();
        if (sessionCount > 0) {
          addLog(`${sessionCount} sessionStorage-Einträge gelöscht`);
        } else {
          addLog('sessionStorage war bereits leer', 'info');
        }

        // 5. Final status
        addLog('✅ Migration erfolgreich abgeschlossen!', 'success');
        addLog('App wird in 2 Sekunden neu geladen...', 'info');

        // 6. Redirect with cache busting (no fixed version)
        await new Promise(resolve => setTimeout(resolve, 2000));
        const timestamp = Date.now();
        window.location.href = `/?updated=true&t=${timestamp}`;

      } catch (error) {
        console.error('Update error:', error);
        addLog(`Fehler: ${error.message}`, 'error');
        addLog('App wird trotzdem neu geladen...', 'error');
        await new Promise(resolve => setTimeout(resolve, 3000));
        const timestamp = Date.now();
        window.location.href = `/?t=${timestamp}`;
      }
    }

    // Start update immediately when page loads
    forceUpdate();
  </script>
</body>
</html>
