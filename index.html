    <!-- v12.20 -->
    
    <!-- Service Worker Registration with Auto-Update -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        // Detect Lovable preview / dev environments where SW caching breaks HMR
        var host = window.location.hostname;
        var isPreview =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host.endsWith('.lovableproject.com') ||
          host.endsWith('.lovable.app') && host.indexOf('preview') !== -1 ||
          host.indexOf('id-preview--') !== -1 ||
          host.indexOf('--') !== -1;

        if (isPreview) {
          // Unregister any existing SW + purge all caches so preview always shows latest build
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          console.log('[PWA] Preview environment — SW disabled, caches cleared');
          return;
        }

        // Production: register SW with auto-update
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          console.log('[PWA] New SW active, reloading...');
          window.location.reload();
        });

        navigator.serviceWorker.register('/sw.js?v=12.20').then(function (reg) {
          console.log('[PWA] SW registered v12.20');
          reg.update();
          setInterval(function () { reg.update(); }, 5 * 60 * 1000);
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function (err) { console.error('[PWA] SW registration failed:', err); });
      })();
    </script>

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
