    <!-- v12.19 - Add Rechnungen (Invoices) tab -->
    
    <!-- Service Worker Registration with Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        // Auto-reload when new service worker takes control
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('[PWA] New SW active, reloading for updates...');
          window.location.reload();
        });
        
        navigator.serviceWorker.register('/sw.js?v=12.19')
          .then(reg => {
            console.log('[PWA] SW registered v12.19');
            
            // Check for updates immediately
            reg.update();
            
            // Check for updates every 5 minutes
            setInterval(() => reg.update(), 5 * 60 * 1000);
            
            // Auto-apply waiting SW
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Update found, auto-applying...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          })
          .catch(err => console.error('[PWA] SW registration failed:', err));
      }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />

    <meta http-equiv="Expires" content="0" />
